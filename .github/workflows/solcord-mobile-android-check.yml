name: Check Solcord Android release startup
on:
  push:
    branches: ["solcord/mobile-builds-*"]
    paths: ["android-validation/**", ".github/workflows/solcord-mobile-android-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    name: Release startup on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download a pinned Discord for the installed-app scenario
        run: |
          set -euo pipefail
          mkdir discord
          for split in base config.x86_64 config.en config.xxhdpi; do
            curl -4 -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 \
              "https://tracker.vendetta.rocks/tracker/download/355010/$split" -o "discord/$split.apk"
          done
          sha256sum discord/*.apk > discord/SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the signed release
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android-validation/startup.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: Android-startup-API-${{ matrix.api }}
          path: android-validation/results/
